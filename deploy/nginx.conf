user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 80k;
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/m;
    map $request_method $feedback_write_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $feedback_write_key zone=feedback_per_ip:5m rate=5r/m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=payment_demo:10m rate=5r/s;

    map "$scheme:$host" $redirect_to_https {
        default 0;
        "http:type.where.work" 1;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 403;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name 47.106.182.159 type.where.work 127.0.0.1 localhost;

        if ($redirect_to_https) {
            return 308 https://type.where.work$request_uri;
        }

        ssl_certificate /etc/nginx/tls/type.where.work.pem;
        ssl_certificate_key /etc/nginx/tls/type.where.work.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        set $app_backend http://app:4173;
        set $demo_backend http://wechat-pay-demo:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;

        location = /payments/notify { proxy_pass $app_backend; }
        location = /payments { return 302 https://pay.where.work/demo/; }
        location /payments/ { return 302 https://pay.where.work/demo/; }
        location ~ ^/business/type-demo-(live|sandbox)$ {
            proxy_pass $demo_backend;
        }

        location / {
            proxy_pass $app_backend;
        }

        location = /api/feedback {
            limit_req zone=feedback_per_ip burst=3 nodelay;
            limit_req_status 429;
            error_page 429 = @feedback_rate_limited;
            proxy_pass $app_backend;
        }

        location @feedback_rate_limited {
            default_type application/json;
            charset utf-8;
            add_header Retry-After 60 always;
            add_header Cache-Control "no-store" always;
            return 429 '{"error":"提交过于频繁，请稍后重试。","code":"RATE_LIMIT","retryAfter":60}';
        }

        location = /api/assistant {
            client_max_body_size 240k;
            limit_req zone=api_per_ip burst=5 nodelay;
            limit_req_status 429;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 100s;
            proxy_pass $app_backend;
        }

    location ~ ^/api/(translate|analyze|review|article-title)$ {
            limit_req zone=api_per_ip burst=5 nodelay;
            limit_req_status 429;
            proxy_pass $app_backend;
        }
    }
    server {
        listen 80;
        server_name pay.where.work;
        set $acme_backend http://pay-acme:80;
        location /.well-known/acme-challenge/ { proxy_pass $acme_backend; }
        location / { return 308 https://pay.where.work$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name pay.where.work;
        ssl_certificate /etc/nginx/tls/pay.where.work.fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/pay.where.work.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;
        set $payment_backend http://wechat-pay-service:18087;
        set $demo_backend http://wechat-pay-demo:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header X-Content-Type-Options nosniff always;
        # Public, standalone integration guide; static files share the existing ACME webroot.
        # Keep exact locations so no other files in that webroot become public over HTTPS.
        location = /docs { return 308 /docs/; }
        location = /docs/ {
            set $docs_backend http://pay-acme:80;
            proxy_pass $docs_backend/docs/integration.html;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
            add_header Referrer-Policy "no-referrer" always;
        }
        location = /docs/integration.md {
            set $docs_text_backend http://pay-acme:80;
            proxy_pass $docs_text_backend/docs/integration.md;
            proxy_hide_header Content-Type;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location = /docs/examples/ClientExample.java {
            set $client_example_backend http://pay-acme:80;
            proxy_pass $client_example_backend/docs/examples/ClientExample.java;
            proxy_hide_header Content-Type;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Disposition 'attachment; filename="ClientExample.java"' always;
            add_header X-Content-Type-Options nosniff always;
        }
        location = /docs/examples/ExistingOrderPayments.java {
            set $order_example_backend http://pay-acme:80;
            proxy_pass $order_example_backend/docs/examples/ExistingOrderPayments.java;
            proxy_hide_header Content-Type;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Disposition 'attachment; filename="ExistingOrderPayments.java"' always;
            add_header X-Content-Type-Options nosniff always;
        }
        location = /downloads/wechat-pay-client-0.1.0.jar {
            set $client_download_backend http://pay-acme:80;
            proxy_pass $client_download_backend/downloads/wechat-pay-client-0.1.0.jar;
            add_header Content-Disposition 'attachment; filename="wechat-pay-client-0.1.0.jar"' always;
            add_header X-Content-Type-Options nosniff always;
        }
        location = /downloads/wechat-pay-client-0.1.0.jar.sha256 {
            set $client_checksum_backend http://pay-acme:80;
            proxy_pass $client_checksum_backend/downloads/wechat-pay-client-0.1.0.jar.sha256;
            add_header X-Content-Type-Options nosniff always;
        }
        location = /downloads/wechat-pay-client-0.2.0.jar {
            set $client_v2_download_backend http://pay-acme:80;
            proxy_pass $client_v2_download_backend/downloads/wechat-pay-client-0.2.0.jar;
            add_header Content-Disposition 'attachment; filename="wechat-pay-client-0.2.0.jar"' always;
            add_header X-Content-Type-Options nosniff always;
        }
        location = /downloads/wechat-pay-client-0.2.0.jar.sha256 {
            set $client_v2_checksum_backend http://pay-acme:80;
            proxy_pass $client_v2_checksum_backend/downloads/wechat-pay-client-0.2.0.jar.sha256;
            add_header X-Content-Type-Options nosniff always;
        }
        location = / { return 302 /docs/; }
        location = /admin { return 308 /admin/; }
        location /admin/ {
            limit_req zone=payment_demo burst=20 nodelay;
            limit_req_status 429;
            proxy_pass $demo_backend;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
        }
        location = /demo { return 308 /demo/; }
        location /demo/ {
            limit_req zone=payment_demo burst=20 nodelay;
            limit_req_status 429;
            proxy_pass $demo_backend;
        }
        location = /callbacks/demo/wechat/payments { proxy_pass $demo_backend; }
        location ~ "^/business/[A-Za-z0-9_-]{1,32}$" { proxy_pass $demo_backend; }
        location = /callbacks/wechat/payments { proxy_pass $payment_backend; }
        location /api/v1/ { proxy_pass $payment_backend; }
        location = /health { proxy_pass $payment_backend; }
        location / { return 404; }
    }
}
