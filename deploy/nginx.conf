user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 80k;
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/m;
    map $request_method $feedback_write_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $feedback_write_key zone=feedback_per_ip:5m rate=5r/m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map "$scheme:$host" $redirect_to_https {
        default 0;
        "http:type.where.work" 1;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 403;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name 47.106.182.159 type.where.work 127.0.0.1 localhost;

        if ($redirect_to_https) {
            return 308 https://type.where.work$request_uri;
        }

        ssl_certificate /etc/nginx/tls/type.where.work.pem;
        ssl_certificate_key /etc/nginx/tls/type.where.work.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        set $app_backend http://app:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;

        location / {
            proxy_pass $app_backend;
        }

        location = /api/feedback {
            limit_req zone=feedback_per_ip burst=3 nodelay;
            limit_req_status 429;
            error_page 429 = @feedback_rate_limited;
            proxy_pass $app_backend;
        }

        location @feedback_rate_limited {
            default_type application/json;
            charset utf-8;
            add_header Retry-After 60 always;
            add_header Cache-Control "no-store" always;
            return 429 '{"error":"提交过于频繁，请稍后重试。","code":"RATE_LIMIT","retryAfter":60}';
        }

    location ~ ^/api/(translate|analyze|review)$ {
            limit_req zone=api_per_ip burst=5 nodelay;
            limit_req_status 429;
            proxy_pass $app_backend;
        }
    }
}
