name: zijian

services:
  app:
    image: node:24-bookworm-slim
    user: node
    working_dir: /app
    command: [node, translation-server.mjs]
    init: true
    env_file:
      - ./config/app.env
    environment:
      ZIJIAN_HOST: 0.0.0.0
      ZIJIAN_FEEDBACK_DATA_DIR: /data
      ZIJIAN_TRUST_PROXY: "1"
      ZIJIAN_PUBLIC_ORIGINS: http://47.106.182.159,http://type.where.work,https://type.where.work,http://127.0.0.1,http://localhost
    volumes:
      - ./src:/app:ro
      - ./data:/data:rw
    expose:
      - "4173"
    read_only: true
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4173/api/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
